<!-- Mobile backdrop -->
<div
  class="nav-backdrop"
  [class.visible]="navOpen"
  (click)="navOpen = false"
></div>

<div class="layout">
  <!-- ── Left Navigation ── -->
  <nav class="side-nav" [class.open]="navOpen">
    <div class="nav-brand">
      <i class="pi pi-warehouse"></i>
      <span>CPHRMA</span>
    </div>

    <ul class="nav-list">
      <li
        *ngFor="let item of menuItems"
        class="nav-item"
        [class.active]="selectedMenu === item.key"
        (click)="selectMenu(item.key)"
      >
        <i [class]="item.icon"></i>
        <span class="nav-label">{{ item.label }}</span>
        <span
          *ngIf="item.key === 'inventory' ? inventoryData.length : item.badge"
          class="nav-badge"
        >
          {{ item.key === "inventory" ? inventoryData.length : item.badge }}
        </span>
      </li>
    </ul>

    <div class="nav-footer">
      <div class="nav-item nav-user">
        <i class="pi pi-user-circle"></i>
        <span class="nav-label">Admin User</span>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ── -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button
          class="hamburger"
          (click)="toggleNav()"
          aria-label="Toggle navigation"
        >
          <i class="pi pi-bars"></i>
        </button>
        <h1 class="page-title">{{ currentMenuLabel }}</h1>
        <span *ngIf="selectedMenu !== 'billing' && selectedMenu !== 'dashboard'" class="record-count">{{ tableData.length }} records</span>
      </div>
      <div class="top-bar-right">
        <button
          *ngIf="selectedMenu !== 'dashboard'"
          pButton
          pRipple
          icon="pi pi-plus"
          label="Add New"
          class="p-button-sm"
          (click)="openAddNewDialog()"
        ></button>
      </div>
    </header>

    <div class="content-body">
      @if (selectedMenu == "settings") {
        <app-setting></app-setting>
      } @else {
        <!-- ── Filter Bar ── -->

        <!-- ── Data Table ── -->
        <div class="table-wrap">
         <!--<app-common-table (eventTrigger)="triggerAction($event)"></app-common-table>--> 
         <router-outlet name="subpage"></router-outlet>
        </div>
      }
    </div>
  </main>
</div>



<p-toast position="bottom-right"></p-toast>
