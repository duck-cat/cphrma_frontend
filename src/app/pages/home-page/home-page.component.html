<!-- Mobile backdrop -->
<div
  class="nav-backdrop"
  [class.visible]="navOpen"
  (click)="navOpen = false"
></div>

<div class="layout">
  <!-- ── Left Navigation ── -->
  <nav class="side-nav" [class.open]="navOpen">
    <div class="nav-brand">
      <i class="pi pi-warehouse"></i>
      <span>CPHRMA</span>
    </div>

    <ul class="nav-list">
      <li
        *ngFor="let item of menuItems"
        class="nav-item"
        [class.active]="selectedMenu === item.key"
        (click)="selectMenu(item.key)"
      >
        <i [class]="item.icon"></i>
        <span class="nav-label">{{ item.label }}</span>
        <span
          *ngIf="item.key === 'inventory' ? inventoryData.length : item.badge"
          class="nav-badge"
        >
          {{ item.key === "inventory" ? inventoryData.length : item.badge }}
        </span>
      </li>
    </ul>

    <div class="nav-footer">
      <div class="nav-item nav-user">
        <i class="pi pi-user-circle"></i>
        <span class="nav-label">Admin User</span>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ── -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button
          class="hamburger"
          (click)="toggleNav()"
          aria-label="Toggle navigation"
        >
          <i class="pi pi-bars"></i>
        </button>
        <h1 class="page-title">{{ currentMenuLabel }}</h1>
        <span class="record-count">{{ tableData.length }} records</span>
      </div>
      <div class="top-bar-right">
        <button
          pButton
          pRipple
          icon="pi pi-plus"
          label="Add New"
          class="p-button-sm"
          (click)="openAddNewDialog()"
        ></button>
      </div>
    </header>

    <div class="content-body">
      @if (selectedMenu == "settings") {
        <app-setting></app-setting>
      } @else {
        <!-- ── Filter Bar ── -->

        <!-- ── Data Table ── -->
        <div class="table-wrap">
          <app-common-table (eventTrigger)="triggerAction($event)"></app-common-table>
        </div>
      }
    </div>
  </main>
</div>

<!-- ── Edit Sidebar ── -->
<p-sidebar
  [(visible)]="editSidebarVisible"
  position="right"
  [style]="{ width: '420px' }"
  styleClass="edit-sidebar"
>
  <ng-template pTemplate="header">
    <div class="sidebar-hdr">
      <i class="pi pi-pencil"></i>
      <span>Edit {{ currentMenuLabel }}</span>
    </div>
  </ng-template>

  <div class="edit-form" *ngIf="selectedRow">
    <!-- INVENTORY -->
    <ng-container *ngIf="selectedMenu === 'inventory'">
      <div class="field">
        <label>HSN Number</label>
        <input pInputText [(ngModel)]="selectedRow.hsn_number" class="w-full" />
      </div>
      <div class="field">
        <label>Batch Number</label>
        <input
          pInputText
          [(ngModel)]="selectedRow.batch_number"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Item Name</label>
        <input pInputText [(ngModel)]="selectedRow.item_name" class="w-full" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea
          pInputTextarea
          [(ngModel)]="selectedRow.item_description"
          rows="3"
          class="w-full"
        ></textarea>
      </div>
      <div class="field">
        <label>Quantity</label>
        <p-inputNumber
          [(ngModel)]="selectedRow.quantity"
          [showButtons]="true"
          [min]="0"
          [style]="{ width: '100%' }"
        ></p-inputNumber>
      </div>
      <div class="field">
        <label>Price</label>
        <p-inputNumber
          [(ngModel)]="selectedRow.price"
          mode="decimal"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [style]="{ width: '100%' }"
        ></p-inputNumber>
      </div>
      <div class="field">
        <label>Location</label>
        <input pInputText [(ngModel)]="selectedRow.location" class="w-full" />
      </div>
      <div class="field">
        <label>Mfg Date</label>
        <p-calendar
          [iconDisplay]="'input'"
          [showIcon]="true"
          size="small"
          [(ngModel)]="selectedRow.mfg_date"
          placeholder="YYYY-MM-DD"
          class="w-full"
        />
      </div>
      <div class="field small-calendar">
        <label>Expiry Date</label>
        <p-calendar
          [iconDisplay]="'input'"
          [showIcon]="true"
          size="small"
          [(ngModel)]="selectedRow.expiry_date"
          placeholder="YYYY-MM-DD"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Purchage Date</label>
        <p-calendar
          [iconDisplay]="'input'"
          [showIcon]="true"
          size="small"
          [(ngModel)]="selectedRow.purchage_date"
          placeholder="YYYY-MM-DD"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Type:</label>
        <p-dropdown
          [(ngModel)]="medType"
          optionLabel="name"
          placeholder="Select"
        />
      </div>
      <div class="field">
        <label>Supplier Name</label>
        <input
          pInputText
          [(ngModel)]="selectedRow.supplier_name"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Supplier Details</label>
        <textarea
          pInputTextarea
          [(ngModel)]="selectedRow.supplier_details"
          rows="2"
          class="w-full"
        ></textarea>
      </div>
    </ng-container>

    <!-- ORDERS -->
    <ng-container *ngIf="selectedMenu === 'orders'">
      <div class="field">
        <label>Order ID</label>
        <input pInputText [ngModel]="selectedRow.id" disabled class="w-full" />
      </div>
      <div class="field">
        <label>Customer</label>
        <input pInputText [(ngModel)]="selectedRow.customer" class="w-full" />
      </div>
      <div class="field">
        <label>Product</label>
        <input pInputText [(ngModel)]="selectedRow.product" class="w-full" />
      </div>
      <div class="field">
        <label>Quantity</label>
        <p-inputNumber
          [(ngModel)]="selectedRow.quantity"
          [showButtons]="true"
          [min]="1"
          [style]="{ width: '100%' }"
        ></p-inputNumber>
      </div>
      <div class="field">
        <label>Date</label>
        <input pInputText [(ngModel)]="selectedRow.date" class="w-full" />
      </div>
      <div class="field">
        <label>Status</label>
        <p-dropdown
          [options]="orderStatusOptions"
          [(ngModel)]="selectedRow.status"
          optionLabel="label"
          optionValue="value"
          [style]="{ width: '100%' }"
        ></p-dropdown>
      </div>
    </ng-container>

    <!-- APPROVALS -->
    <ng-container *ngIf="selectedMenu === 'approvals'">
      <div class="field">
        <label>Request ID</label>
        <input pInputText [ngModel]="selectedRow.id" disabled class="w-full" />
      </div>
      <div class="field">
        <label>Requested By</label>
        <input
          pInputText
          [(ngModel)]="selectedRow.requestedBy"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Type</label>
        <input pInputText [(ngModel)]="selectedRow.type" class="w-full" />
      </div>
      <div class="field">
        <label>Date</label>
        <input pInputText [(ngModel)]="selectedRow.date" class="w-full" />
      </div>
      <div class="field">
        <label>Priority</label>
        <p-dropdown
          [options]="priorityOptions"
          [(ngModel)]="selectedRow.priority"
          optionLabel="label"
          optionValue="value"
          [style]="{ width: '100%' }"
        ></p-dropdown>
      </div>
      <div class="field">
        <label>Status</label>
        <p-dropdown
          [options]="approvalStatusOptions"
          [(ngModel)]="selectedRow.status"
          optionLabel="label"
          optionValue="value"
          [style]="{ width: '100%' }"
        ></p-dropdown>
      </div>
    </ng-container>

    <!-- SETTINGS -->
    <ng-container *ngIf="selectedMenu === 'settings'">
      <div class="field">
        <label>Setting</label>
        <input
          pInputText
          [ngModel]="selectedRow.setting"
          disabled
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Value</label>
        <input pInputText [(ngModel)]="selectedRow.value" class="w-full" />
      </div>
      <div class="field">
        <label>Category</label>
        <input
          pInputText
          [ngModel]="selectedRow.category"
          disabled
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea
          pInputTextarea
          [(ngModel)]="selectedRow.description"
          rows="4"
          class="w-full"
        ></textarea>
      </div>
    </ng-container>
  </div>

  <ng-template pTemplate="footer">
    <div class="sidebar-ftr">
      <button
        pButton
        pRipple
        label="Cancel"
        icon="pi pi-times"
        class="p-button-outlined p-button-secondary"
        (click)="editSidebarVisible = false"
      ></button>
      <button
        pButton
        pRipple
        label="Delete"
        icon="pi pi-trash"
        class="p-button-outlined p-button-danger"
        *ngIf="selectedMenu === 'inventory' && !isNewRecord"
        (click)="deleteRow()"
      ></button>
      <button
        pButton
        pRipple
        [label]="isNewRecord ? 'Create' : 'Save Changes'"
        icon="pi pi-check"
        (click)="saveRow()"
      ></button>
    </div>
  </ng-template>
</p-sidebar>

<p-toast position="bottom-right"></p-toast>
