
<div class="dialog-content">

  <form
    [formGroup]="form"
    (ngSubmit)="submit()">

    <app-common-form
      formControlName="dynamicForm"
      [fields]="fields"
      [layout]="layout"
      [columns]="columns">
    </app-common-form>

    <div class="dialog-footer">

      <button
        pButton
        type="button"
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (click)="cancel()">
      </button>

      <button
        pButton
        type="submit"
        label="Submit"
        icon="pi pi-check">
      </button>

    </div>

  </form>

</div>
